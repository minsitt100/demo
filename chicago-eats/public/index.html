<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Chicago Eats — new restaurants</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <div class="brand">
          <span class="dot" aria-hidden="true"></span>
          <div>
            <h1>Chicago Eats</h1>
            <p class="tagline">New restaurants, aggregated from the sources you trust.</p>
          </div>
        </div>
        <div class="header-actions">
          <span class="last-updated" id="last-updated">—</span>
          <button class="btn ghost" id="refresh-btn" title="Fetch new items from all sources now">
            <span class="btn-icon" aria-hidden="true">↻</span>
            Refresh
          </button>
        </div>
      </div>
    </header>

    <main class="container" id="container">
      <section class="filters-section">
        <h2 class="filters-heading">Filters</h2>
        <div class="filter-pills" id="filter-pills">
          <div class="filter-pill-wrap" data-filter="cuisine">
            <label>Cuisine</label>
            <button class="filter-pill" type="button">
              <span class="pill-label">All cuisines</span>
              <span class="pill-badge" hidden></span>
              <svg class="pill-chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="filter-dropdown" hidden></div>
          </div>
          <div class="filter-pill-wrap" data-filter="time">
            <label>Time Period</label>
            <button class="filter-pill" type="button">
              <span class="pill-label">Past 90 days</span>
              <svg class="pill-chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="filter-dropdown" hidden></div>
          </div>
          <div class="filter-pill-wrap" data-filter="price">
            <label>Price</label>
            <button class="filter-pill" type="button">
              <span class="pill-label">Any price</span>
              <span class="pill-badge" hidden></span>
              <svg class="pill-chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="filter-dropdown" hidden></div>
          </div>
          <div class="filter-pill-wrap" data-filter="neighborhood">
            <label>Neighborhood</label>
            <button class="filter-pill" type="button">
              <span class="pill-label">All neighborhoods</span>
              <span class="pill-badge" hidden></span>
              <svg class="pill-chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="filter-dropdown" hidden></div>
          </div>
        </div>
        <div class="active-filters" id="active-filters" hidden>
          <span class="active-filters-label">Active Filters</span>
          <div class="active-filters-list" id="active-filters-list"></div>
          <button class="clear-filters" id="clear-filters">Clear Filters</button>
        </div>
        <div class="counts" id="counts">—</div>
      </section>

      <div class="layout" id="layout">
        <div class="layout-left">
          <section class="rgrid" id="rgrid" aria-live="polite"></section>

          <section class="footer-status" id="footer-status" hidden>
            <h4>Sources</h4>
            <ul id="source-status"></ul>
          </section>
        </div>

        <aside class="layout-right" id="detail-pane" hidden aria-label="Restaurant detail">
          <button class="detail-close" id="detail-close" aria-label="Close">✕</button>
          <div class="detail-body" id="detail-body"></div>
        </aside>
      </div>
    </main>

    <div class="toast" id="toast" hidden></div>

    <script src="./app.js"></script>
  </body>
</html>
